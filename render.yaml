# Render Blueprint: two free Docker web services from this repo.
# In Render: New → Blueprint → pick this repo.  You'll be asked for the
# values marked `sync: false`.
#
# Free-tier caveats: the backend sleeps after ~15 min idle (30–60 s to wake)
# and has no persistent disk, so uploaded data is lost when it restarts.
services:
  - type: web
    name: chat-memory-api
    runtime: docker
    dockerfilePath: ./docker/app.Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY        # optional fallback
        sync: false
      - key: CHROMA_PERSIST_DIR
        value: /tmp/chat-data/chroma
      - key: SQLITE_PATH
        value: /tmp/chat-data/dedup.db

  - type: web
    name: chat-memory-ui
    runtime: docker
    dockerfilePath: ./docker/frontend.Dockerfile
    dockerContext: .
    plan: free
    envVars:
      # The backend's public URL, e.g. https://chat-memory-api.onrender.com
      - key: BACKEND_URL
        sync: false
