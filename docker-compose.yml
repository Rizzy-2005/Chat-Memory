services:
  # ── FastAPI backend ──────────────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: docker/app.Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      # Named volume keeps Chroma + dedup.db alive across container restarts.
      - chat_data:/workspace/app/data
    restart: unless-stopped

  # ── Streamlit frontend ───────────────────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    ports:
      - "8501:8501"
    environment:
      - BACKEND_URL=http://app:8000
    depends_on:
      - app
    restart: unless-stopped

volumes:
  chat_data:
